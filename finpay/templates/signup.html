{% extends "base.html" %}

{% block title %}Create Account | FinPay Insights{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">🚀</div>
            <h2>Create Analyst Account</h2>
            <p>Get instant access to your private AI spending analytics workspace</p>
        </div>

        <form method="POST" action="{{ url_for('auth.signup') }}" class="auth-form">
            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input 
                    type="text" 
                    id="full_name" 
                    name="full_name" 
                    placeholder="e.g. Jordan Miller" 
                    required 
                    autocomplete="name"
                    value="{{ full_name or '' }}"
                >
            </div>

            <div class="form-group">
                <label for="username">Work Email Address</label>
                <input 
                    type="email" 
                    id="username" 
                    name="username" 
                    placeholder="jordan.miller@company.com" 
                    required 
                    autocomplete="email"
                    value="{{ username or '' }}"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="At least 6 characters" 
                    required 
                    minlength="6"
                    autocomplete="new-password"
                >
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input 
                    type="password" 
                    id="confirm_password" 
                    name="confirm_password" 
                    placeholder="Re-type password" 
                    required 
                    minlength="6"
                    autocomplete="new-password"
                >
            </div>

            <button type="submit" class="btn-primary btn-block">Register & Launch Workspace</button>
        </form>

        <div class="auth-footer-links">
            <p>Already have an account? <a href="{{ url_for('auth.login') }}" class="auth-link">Sign in here</a></p>
        </div>
    </div>
</div>
{% endblock %}
